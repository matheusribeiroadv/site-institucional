# Configuração da Netlify — site estático (pasta publicada = raiz deste deploy)
[build]
  publish = "."

# Cache longo para assets versionáveis (imagens, libs) — melhora velocidade/SEO
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos de segurança básicos para todo o site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
