# Configuração da Netlify — site estático, sem etapa de build.
# Só a pasta public/ vai para o ar; o resto do repositório (README, ferramentas,
# package.json) fica fora do site.
[build]
  publish = "public"

# Cache das imagens e da biblioteca de animação: 30 dias.
# Os nomes dos arquivos NÃO têm versão — ao trocar uma imagem, use um NOME NOVO
# (ex.: og-image-2027.jpg), senão quem já visitou pode ver a antiga por até 30 dias.
# CSS, JS e HTML ficam no padrão da Netlify (o navegador confere a cada visita),
# então mudanças de layout aparecem logo após o deploy.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Cabeçalhos de segurança básicos para todo o site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
