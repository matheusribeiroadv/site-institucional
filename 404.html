<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Matheus Ribeiro Advogados</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .err{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;
      padding:40px 24px;position:relative;
      background:radial-gradient(120% 120% at 50% 30%, var(--navy) 0%, var(--navy-deep) 70%);}
    .err-inner{max-width:560px}
    .err-shield{width:84px;margin:0 auto 28px;filter:drop-shadow(0 10px 30px rgba(184,146,83,.35))}
    .err-code{font-family:'Cormorant Garamond',serif;font-size:clamp(4.5rem,16vw,8rem);line-height:1;
      color:transparent;background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));
      -webkit-background-clip:text;background-clip:text;margin-bottom:8px}
    .err h1{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--cream);margin-bottom:16px}
    .err p{color:rgba(244,241,234,.74);margin:0 auto 32px;max-width:440px}
    .err-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  </style>

  <!-- Analytics (Umami — sem cookies, sem dados pessoais) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="15bda1c5-726a-4f71-923d-2145b2f368bb"></script>
</head>
<body>
  <main class="err">
    <div class="err-inner">
      <img src="/assets/shield.png" alt="Matheus Ribeiro Advogados" class="err-shield" />
      <div class="err-code">404</div>
      <h1>Página não encontrada</h1>
      <p>O endereço que você acessou não existe ou foi movido. Use os atalhos abaixo para continuar navegando.</p>
      <div class="err-actions">
        <a href="/" class="btn btn-primary">Voltar ao início</a>
        <a href="/blog/" class="btn btn-ghost">Ver o blog</a>
      </div>
    </div>
  </main>
</body>
</html>
